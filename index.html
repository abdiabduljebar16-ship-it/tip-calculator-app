<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <title>Frontend Mentor | Tip calculator app</title>
    <style>
      .attribution {
        font-size: 0.6875rem;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
    </style>
  </head>
  <body>
    <h1>
      SPLIT <br />
      TTER
    </h1>
    <label for="bill">Bill</label>
    <input type="number" id="bill" required />
    <p>Select Tip %</p>
    <button value="5">5%</button><button value="10">10%</button
    ><button value="15">15%</button><button value="25">25%</button
    ><button value="50">50%</button>
    <input type="numer" placeholder="custom" />

    <label for="people">Number of People</label>
    <input type="number" id="people" />

    <div>
      <p>Tip Amount / person</p>
      <p>Total / person</p>
      <button>Reset</button>
    </div>
  </body>
</html>
