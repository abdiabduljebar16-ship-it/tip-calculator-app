<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Frontend Mentor | Tip calculator app</title>
  </head>
  <body>
    <div class="imageContainer">
      <img src="images/logo.svg" alt="logo it says SPLI TTER" />
    </div>
    <form action="">
      <label for="bill">Bill</label>
      <div>
        <img src="images/icon-dollar.svg" alt="dolor sign" />
        <input type="number" id="bill" required />
      </div>
      <p>Select Tip %</p>
      <div class="tipContainer">
        <button value="5">5%</button>
        <button value="10">10%</button>
        <button value="15">15%</button>
        <button value="25">25%</button>
        <button value="50">50%</button>
        <input type="numer" placeholder="custom" />
      </div>

      <label for="people">Number of People</label>
      <div>
        <img src="images/icon-person.svg" alt="" />
        <input type="number" id="people" />
      </div>

      <div class="displayContainer">
        <div class="tipAmaountContainer">
          <p>
            Tip Amount <br />
            <span>/ person</span>
          </p>
          <p class="tipAmount"></p>
        </div>
        <div class="totalAmountContainer">
          <p>
            Total <br />
            <span>/ person</span>
          </p>
          <p class="total"></p>
        </div>
        <button type="reset">Reset</button>
      </div>
    </form>
  </body>
</html>
